name: Public JD Sync
run-name: 📥 Public JD Sync

on:
  push:
    paths:
      - "data/upstream/queue.json"
  schedule:
    # Safety net for jobs still waiting after the public repo moves.
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: job-data-sync
  cancel-in-progress: false
  queue: max

jobs:
  gate:
    # Applying JDs rewrites queue.json. That push must not start another sync.
    if: "${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(upstream):') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      due: ${{ steps.check.outputs.due }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: ${{ github.ref_name }}
          token: ${{ secrets.PAT }}

      - name: Check whether queued jobs are waiting
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          sha="$(git ls-remote https://github.com/Donkey0322/JobRadar-AI.git refs/heads/main | awk '{print $1}')"
          REMOTE_SHA="$sha" node .github/scripts/upstream-due.mjs
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "Manual run."
          fi

  sync:
    needs: gate
    if: needs.gate.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          token: ${{ secrets.PAT }}

      - name: Compare public commit
        id: public
        run: |
          sha="$(git ls-remote https://github.com/Donkey0322/JobRadar-AI.git refs/heads/main | awk '{print $1}')"
          REMOTE_SHA="$sha" node .github/scripts/upstream-due.mjs

      - name: Checkout public opportunities
        if: steps.public.outputs.run == 'true'
        uses: actions/checkout@v6
        with:
          repository: Donkey0322/JobRadar-AI
          ref: main
          path: upstream
          sparse-checkout: data
          sparse-checkout-cone-mode: true
          fetch-depth: 1
          persist-credentials: false

      - name: Setup pnpm and Node
        if: steps.public.outputs.run == 'true'
        uses: ./.github/actions/setup-jobradar

      - name: Check configuration
        if: steps.public.outputs.run == 'true'
        run: pnpm jobctl setup check-config
        env:
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          PAT: ${{ secrets.PAT }}
          LOG_PRETTY: "1"

      - name: Apply queued public JDs
        id: apply
        if: steps.public.outputs.run == 'true'
        env:
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          PAT: ${{ secrets.PAT }}
          LOG_PRETTY: "1"
          UPSTREAM_DATA_PATH: ${{ github.workspace }}/upstream/data
        run: |
          export UPSTREAM_COMMIT="$(git -C "${GITHUB_WORKSPACE}/upstream" rev-parse HEAD)"
          pnpm jobctl upstream

          if [[ -n "$(git status --porcelain data/ 2>/dev/null)" ]]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "No queued public JDs to apply."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit applied JDs
        if: steps.public.outputs.run == 'true' && steps.apply.outputs.has_changes == 'true'
        run: |
          git config user.name "actions-bot"
          git config user.email "actions@github.com"

          git add data/
          git commit -m "chore(upstream): apply public job descriptions"

      - name: Push applied JDs
        if: steps.public.outputs.run == 'true' && steps.apply.outputs.has_changes == 'true'
        uses: ./.github/actions/rebase-push
        with:
          token: ${{ secrets.PAT }}
          ref: ${{ github.ref_name }}
